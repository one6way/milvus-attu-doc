# =============================================================================
# Milvus 3.0 + Attu 3.0 — CI/CD
#
# Стадии и джобы:
#   lint     : lint:yamllint, lint:powershell, lint:python, lint:helm
#   package  : package:charts            (Helm-чарты в *.tgz -> artifacts)
#   check    : check:artifacts           (проверка артефактов сборки)
#   validate : prep:env, validate:render (окружение + рендер шаблонов)
#   deploy   : deploy:milvus, deploy:attu (через GitLab Agent, по тегу deploy-*)
#   verify   : verify:stack              (проверка установленного ПО)
#
# ВСЕ джобы идут на shared-раннерах GitLab.com.
# deploy/verify попадают на кластер через GitLab Agent for Kubernetes
# (входящий доступ к кластеру не нужен) и запускаются по тегу deploy-*
# либо вручную: Run pipeline -> переменная DEPLOY=true.
# =============================================================================

stages:
  - lint
  - package
  - check
  - validate
  - deploy
  - verify

default:
  interruptible: true

variables:
  # Закреплённые версии (pinned) для воспроизводимости
  MILVUS_CHART_REPO: "https://zilliztech.github.io/milvus-helm/"
  MILVUS_CHART_VERSION: "5.0.30"        # -> образ milvusdb/milvus:v3.0.1
  ATTU_REPOSITORY: "zilliz/attu"
  ATTU_TAG: "v3.0.1"
  HELM_IMAGE: "alpine/helm:3.16.4"
  NAMESPACE: "milvus"
  # Публичный адрес Attu для ДРУГИХ ПК (браузер). Появится в GitLab как ссылка
  # на окружении и в логе verify:stack. Пустое значение = доступ только локально
  # через kubectl port-forward (см. scripts/share-attu.ps1).
  # Переопределяется в Settings -> CI/CD -> Variables (например, адрес туннеля).
  ATTU_PUBLIC_URL: "http://127.0.0.1:3000"
  # Логин Attu 3.0 (у приложения своя авторизация). Переопределяйте в
  # Settings -> CI/CD -> Variables (Masked), значения в git — только для демо.
  ATTU_ADMIN_USER: "admin"
  ATTU_ADMIN_PASSWORD: "AttuDemo123!"
  # GitLab Agent for Kubernetes (см. .gitlab/agents/milvus-k8s/config.yaml)
  AGENT_PATH: "nikobellic438/milvus:milvus-k8s"
  GIT_DEPTH: "50"

# =============================================================================
# LINT
# =============================================================================

lint:yamllint:
  stage: lint
  image: python:3.11-slim
  script:
    - pip install --quiet yamllint
    - yamllint -c .yamllint .gitlab-ci.yml values/ docker-compose.yml docker/milvus-user.yaml

lint:powershell:
  stage: lint
  image: mcr.microsoft.com/powershell:7.4-ubuntu-22.04
  script:
    - pwsh -NoProfile -File scripts/ci-lint-powershell.ps1

lint:python:
  stage: lint
  image: python:3.11-slim
  script:
    - python -m compileall -q scripts
    - echo "Python compile OK"

lint:helm:
  stage: lint
  image:
    name: alpine/helm:3.16.4
    entrypoint: [""]     # у образа entrypoint=helm; сбрасываем для запуска script
  script:
    - helm lint chart/attu
    - helm repo add milvus "$MILVUS_CHART_REPO" && helm repo update milvus
    # helm lint не имеет --version: сначала тянем нужную версию чарта
    - helm pull milvus/milvus --version "$MILVUS_CHART_VERSION" --untar --untardir .charts
    - helm lint .charts/milvus -f values/milvus.yaml
# =============================================================================
# PACKAGE — сборка артефактов (Helm-чарты)
# =============================================================================

package:charts:
  stage: package
  image:
    name: alpine/helm:3.16.4
    entrypoint: [""]
  script:
    - mkdir -p dist
    - helm package chart/attu --destination dist
    - helm repo add milvus "$MILVUS_CHART_REPO" && helm repo update milvus
    - helm pull milvus/milvus --version "$MILVUS_CHART_VERSION" --destination dist
    - ls -l dist
  artifacts:
    name: "charts-$CI_COMMIT_SHORT_SHA"
    paths:
      - dist/*.tgz
    expire_in: 1 week

# =============================================================================
# CHECK — проверка артефактов сборки
# =============================================================================

check:artifacts:
  stage: check
  image:
    name: alpine/helm:3.16.4
    entrypoint: [""]
  needs: ["package:charts"]
  script:
    - ls -l dist
    - test -n "$(ls -A dist/*.tgz)" || (echo "Нет .tgz артефактов" && exit 1)
    - for f in dist/*.tgz; do echo "== $f"; helm show chart "$f"; done
    - echo "Артефакты валидны"

# =============================================================================
# VALIDATE — окружение и рендер
# =============================================================================

prep:env:
  stage: validate
  image:
    name: alpine/helm:3.16.4
    entrypoint: [""]
  script:
    - echo "Helm:"; helm version --short
    - echo "Ожидаем Milvus chart=$MILVUS_CHART_VERSION Attu=$ATTU_REPOSITORY:$ATTU_TAG ns=$NAMESPACE"
    - test -f values/milvus.yaml || (echo "missing values/milvus.yaml" && exit 1)
    - test -f values/attu.yaml   || (echo "missing values/attu.yaml" && exit 1)
    - test -f chart/attu/Chart.yaml || (echo "missing chart/attu" && exit 1)
    - echo "Окружение и файлы в порядке"

validate:render:
  stage: validate
  image:
    name: alpine/helm:3.16.4
    entrypoint: [""]
  script:
    - echo "Rendering Attu..."
    - helm template attu chart/attu -f values/attu.yaml --set image.repository="$ATTU_REPOSITORY" --set image.tag="$ATTU_TAG" > /dev/null
    - echo "Rendering Milvus..."
    - helm repo add milvus "$MILVUS_CHART_REPO" && helm repo update milvus
    - helm template milvus milvus/milvus --version "$MILVUS_CHART_VERSION" -f values/milvus.yaml > /dev/null
    - echo "Both charts render OK"

# =============================================================================
# DEPLOY — установка на кластер через GitLab Agent for Kubernetes
# Работает на shared-раннерах GitLab.com: входящий доступ к кластеру не нужен,
# соединение инициирует агент из кластера (KAS).
# =============================================================================

.deploy_rules: &deploy_rules
  - if: '$DEPLOY == "true"'
    when: always
  - if: '$CI_COMMIT_TAG =~ /^deploy-/'
    when: always
  - when: never

.deploy_base: &deploy_base
  image:
    name: alpine/k8s:1.31.1    # kubectl + helm
    entrypoint: [""]
  variables:
    KUBE_CONTEXT: "nikobellic438/milvus:milvus-k8s"
  before_script:
    - kubectl config use-context "$KUBE_CONTEXT"

deploy:milvus:
  <<: *deploy_base
  stage: deploy
  rules: *deploy_rules
  environment:
    name: milvus
    kubernetes:
      agent: nikobellic438/milvus:milvus-k8s
  script:
    - echo "Контекст:"; kubectl config current-context
    - helm repo add milvus "$MILVUS_CHART_REPO" && helm repo update milvus
    - kubectl create namespace "$NAMESPACE" --dry-run=client -o yaml | kubectl apply -f -
    - helm upgrade --install milvus milvus/milvus --version "$MILVUS_CHART_VERSION" -n "$NAMESPACE" -f values/milvus.yaml --wait --timeout 15m
    - kubectl -n "$NAMESPACE" get pods

deploy:attu:
  <<: *deploy_base
  stage: deploy
  rules: *deploy_rules
  needs: ["deploy:milvus"]
  environment:
    name: milvus
    kubernetes:
      agent: nikobellic438/milvus:milvus-k8s
  script:
    - helm upgrade --install attu chart/attu -n "$NAMESPACE" -f values/attu.yaml
      --set image.repository="$ATTU_REPOSITORY" --set image.tag="$ATTU_TAG"
      --set-string admin.user="$ATTU_ADMIN_USER" --set-string admin.password="$ATTU_ADMIN_PASSWORD"
      --wait --timeout 5m
    - kubectl -n "$NAMESPACE" get svc attu

# =============================================================================
# VERIFY — проверка установленного ПО (через агента)
# =============================================================================

verify:stack:
  <<: *deploy_base
  stage: verify
  rules: *deploy_rules
  needs: ["deploy:attu"]
  environment:
    name: milvus
    url: "$ATTU_PUBLIC_URL"
    kubernetes:
      agent: nikobellic438/milvus:milvus-k8s
  script:
    - echo "== Pods =="; kubectl -n "$NAMESPACE" get pods -o wide
    - echo "== Services =="; kubectl -n "$NAMESPACE" get svc
    - kubectl -n "$NAMESPACE" wait --for=condition=Ready pod -l app.kubernetes.io/instance=milvus --timeout=600s
    - kubectl -n "$NAMESPACE" wait --for=condition=Ready pod -l app.kubernetes.io/instance=attu --timeout=300s
    - echo "== Helm releases =="; helm list -n "$NAMESPACE"
    - echo "Стенд Milvus + Attu установлен и готов"
    - echo "Attu для браузера (в т.ч. с другого ПК) = $ATTU_PUBLIC_URL"
    - echo "Логин Attu = $ATTU_ADMIN_USER (пароль — CI-переменная ATTU_ADMIN_PASSWORD)"
    - echo "Ссылка также в Operate -> Environments -> milvus"
