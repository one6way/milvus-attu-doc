# Milvus 3.0 (Helm chart 5.0.30) для локального кластера Docker Desktop.
# Назначение: минимальный standalone на одном узле с StorageClass "standard".
# Установка: scripts/install-milvus-attu.ps1
#
# Отличия от старого vendored чарта (chart/milvus 4.2.33, Milvus 2.5.0):
#   - message queue = woodpecker (встроен), Pulsar больше НЕ требуется;
#   - pulsarv3/pulsar/kafka выключены явно.

cluster:
  enabled: false

standalone:
  replicas: 1
  # Дефолт 2.6+/3.0, но фиксируем явно: встроенный WAL, без Pulsar.
  messageQueue: woodpecker
  resources:
    requests:
      cpu: 200m
      memory: 1Gi
    limits:
      cpu: "2"
      memory: 3Gi
  persistence:
    enabled: true
    persistentVolumeClaim:
      storageClass: standard
      size: 10Gi

image:
  all:
    repository: milvusdb/milvus
    tag: v3.0.1
    pullPolicy: IfNotPresent

# Сообщения шины: всё выключено, работаем на woodpecker.
pulsarv3:
  enabled: false
pulsar:
  enabled: false
kafka:
  enabled: false

etcd:
  enabled: true
  replicaCount: 1
  persistence:
    enabled: true
    storageClass: standard
    size: 4Gi

minio:
  enabled: true
  mode: standalone
  persistence:
    enabled: true
    storageClass: standard
    size: 10Gi

service:
  type: ClusterIP
  port: 19530

# Авторизация Milvus — ОБЯЗАТЕЛЬНА, если порт 19530 открывается наружу
# (туннель, NodePort). Без неё любой, кто дошёл до 19530, может читать,
# писать и удалять коллекции.
#
# Применяется при следующем деплое (тег deploy-*):
#   helm upgrade milvus ... -f values/milvus.yaml
# После включения пароль передаётся так:
#   pymilvus: MilvusClient(uri="http://host:19530", token="root:<пароль>")
#   Attu:     Connect -> host/port + User=root, Password=<пароль>
#
# defaultRootPassword действует при первой инициализации; максимум 72 символа.
# Значение ниже — демонстрационное, для продакшена задавайте через Secret.
extraConfigFiles:
  user.yaml: |+
    common:
      security:
        authorizationEnabled: true
        defaultRootPassword: MilvusDemo123
