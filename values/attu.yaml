# Профиль для локального кластера (Docker Desktop k8s).
# Образ Attu v3.0.1 берётся напрямую из Docker Hub (zilliz/attu) — сборка образа не нужна.
milvus:
  address: "milvus:19530"

image:
  repository: zilliz/attu
  tag: "v3.0.1"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 3000

# Служебная БД Attu (аккаунты, сохранённые соединения, история AI-агента) — /data/attu.db.
# Без PVC аккаунт и API-ключи пропадут при рестарте пода.
persistence:
  enabled: true
  storageClass: standard
  size: 1Gi

# Первичный администратор Attu для демо (создаётся при первом старте).
# Требования к паролю: 8–128 символов, минимум 3 класса из 4 (A-Z, a-z, 0-9, спецсимволы).
# В продакшене — задавайте через CI/CD variables или Secret, не храните в git.
admin:
  user: "admin"
  password: "AttuDemo123!"

# Демо: разрешаем LLM/embeddings по приватным адресам (например, Ollama/LM Studio в LAN).
# Для облачных провайдеров (OpenAI и совместимые) это не требуется.
allowPrivateModelEndpoints: true
