# Attu — AI Workbench для Milvus (совместим с Milvus 2.6+/3.x).
#
# ВАЖНО про версии:
#   Attu v3.x читает MILVUS_ADDRESS (в v2.x было MILVUS_URL) — чарт отдаёт обе.
#   Milvus 2.5.x и старее Attu 3.0 НЕ поддерживает.

milvus:
  # Основной адрес Milvus (краткое имя сервиса в том же namespace).
  address: "milvus:19530"
  # Legacy-алиас (Attu 2.x). Если address пуст — берётся отсюда.
  url: ""

replicaCount: 1

image:
  repository: zilliz/attu
  tag: "v3.0.1"
  pullPolicy: IfNotPresent

nameOverride: ""
fullnameOverride: ""

service:
  type: ClusterIP
  port: 3000
  targetPort: 3000
  # При type: NodePort задайте 30000–32767 или оставьте пустым для авто-назначения
  nodePort: ""

# Attu 3.0 хранит служебную БД (аккаунты, сохранённые соединения, история AI-агента)
# в /data/attu.db. Без persistent-тома всё это теряется при рестарте пода.
persistence:
  enabled: true
  # Использовать существующий PVC (тогда новый не создаётся).
  existingClaim: ""
  # "" -> дефолтный StorageClass кластера (в Docker Desktop это "standard")
  storageClass: ""
  accessModes:
    - ReadWriteOnce
  size: 1Gi

# Первичный администратор Attu: если задан, аккаунт создаётся/восстанавливается при старте.
# Требования к паролю: 8–128 символов, минимум 3 класса из 4 (A-Z, a-z, 0-9, спецсимволы).
admin:
  user: "admin"
  password: "AttuDemo123!"
  email: ""
  name: ""
  # Ключ шифрования сохранённых секретов (ATTU_SECRET_KEY). Если не задан —
  # генерируется и хранится в /data/attu.db. Смена ключа делает старые секреты нечитаемыми.
  secretKey: ""

# Разрешить обращения Attu (LLM/embeddings) к приватным адресам (например, Ollama в LAN).
# Включайте осознанно: это ослабляет SSRF-защиту.
allowPrivateModelEndpoints: false

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000

containerSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    memory: 512Mi

nodeSelector: {}
tolerations: []
affinity: {}

# Optional extra env (e.g. ATTU_LOG_LEVEL=info)
extraEnv: []
