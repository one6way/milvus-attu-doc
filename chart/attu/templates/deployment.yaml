apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "attu.fullname" . }}
  labels:
    {{- include "attu.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "attu.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "attu.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: attu
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort }}
              protocol: TCP
          env:
            # Attu v3 читает MILVUS_ADDRESS; MILVUS_URL оставляем для v2-совместимости.
            - name: MILVUS_ADDRESS
              value: {{ default .Values.milvus.url .Values.milvus.address | quote }}
            {{- if .Values.milvus.url }}
            - name: MILVUS_URL
              value: {{ .Values.milvus.url | quote }}
            {{- end }}
            {{- if .Values.admin.user }}
            - name: ATTU_ADMIN_USER
              value: {{ .Values.admin.user | quote }}
            - name: ATTU_ADMIN_PASSWORD
              value: {{ .Values.admin.password | quote }}
            {{- if .Values.admin.email }}
            - name: ATTU_ADMIN_EMAIL
              value: {{ .Values.admin.email | quote }}
            {{- end }}
            {{- if .Values.admin.name }}
            - name: ATTU_ADMIN_NAME
              value: {{ .Values.admin.name | quote }}
            {{- end }}
            {{- end }}
            {{- if .Values.admin.secretKey }}
            - name: ATTU_SECRET_KEY
              value: {{ .Values.admin.secretKey | quote }}
            {{- end }}
            {{- if .Values.allowPrivateModelEndpoints }}
            - name: ATTU_SSRF_ALLOW_PRIVATE
              value: "true"
            {{- end }}
            {{- range .Values.extraEnv }}
            - name: {{ .name }}
              value: {{ .value | quote }}
            {{- end }}
          {{- with .Values.containerSecurityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            # Служебная БД Attu (аккаунты/соединения/история агента): /data/attu.db
            - name: attu-data
              mountPath: /data
      volumes:
        - name: attu-data
{{- if .Values.persistence.existingClaim }}
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.existingClaim }}
{{- else if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "attu.fullname" . }}-data
{{- else }}
          emptyDir: {}
{{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
